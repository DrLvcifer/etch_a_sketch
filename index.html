<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Etch a Sketch</title>
      <link rel="stylesheet" href="styles/style.css" />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
         href="https://fonts.googleapis.com/css2?family=Jersey+25&family=Micro+5&display=swap"
         rel="stylesheet"
      />
   </head>
   <body>
      <header>
         <h1 id="main-title">Etch a Sketch</h1>
      </header>
      <main>
         <button id="settings-btn" type="button" name="button">
            Sketch Resolution
         </button>

         <dialog id="pop-up">
            <form method="dialog">
               <h2>Select the Sketch Resolution</h2>
               <div class="card-selector">
                  <label class="res-card">
                     <input
                        id="resolution-input"
                        type="radio"
                        name="resolution"
                        value="256"
                        checked
                     />
                     <div class="card-content">
                        <span class="title">Low</span>
                        <span class="desc">16 x 16</span>
                     </div>
                  </label>
                  <label class="res-card">
                     <input
                        id="resolution-input"
                        type="radio"
                        name="resolution"
                        value="1024"
                     />
                     <div class="card-content">
                        <span class="title">Medium</span>
                        <span class="desc">32 x 32</span>
                     </div>
                  </label>
                  <label class="res-card">
                     <input
                        id="resolution-input"
                        type="radio"
                        name="resolution"
                        value="4096"
                     />
                     <div class="card-content">
                        <span class="title">High</span>
                        <span class="desc">64 x 64</span>
                     </div>
                  </label>
               </div>
               <div class="actions">
                  <button id="confirm-btn">Confirm</button>
                  <button id="cancel-btn">Cancel</button>
               </div>
            </form>
         </dialog>
         <section id="wrapper">
            <div id="flex-container"></div>
         </section>
      </main>
      <script src="scripts/script.js"></script>
   </body>
</html>
